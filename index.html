<link rel="stylesheet" href="style.css">
<script src="script.js"></script>

<main class="calc">
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="k fn" data-k="clear">AC</button>
    <button class="k op" data-k="op" data-op="/">÷</button>
    <button class="k" data-k="digit" data-d="7">7</button>
    <!-- ...one button per key -->
    <button class="k eq" data-k="equals">=</button>
  </div>
</main>
